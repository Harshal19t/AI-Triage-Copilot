name: Nightly ingest

on:
  schedule:
    - cron: "0 6 * * *"   # 6am UTC daily
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Ingest issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/ingest_issues.py --repo Textualize/textual --db data/triage.db

      - name: Ingest docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/ingest_docs.py --repo Textualize/textual --docs-path docs --db data/triage.db

      - name: Commit updated database
        run: |
          git config user.name "triage-bot"
          git config user.email "actions@github.com"
          git add data/triage.db
          git diff --cached --quiet || git commit -m "chore: nightly issue/doc ingest"
          git push
