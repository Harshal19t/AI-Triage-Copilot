name: Nightly ingest

on:
  schedule:
    - cron: "0 6 * * *"   # 6am UTC daily
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the "Commit updated database" step can push -- default is read-only

concurrency:
  group: repo-data-write   # shared with triage-watch.yml -- queues instead of racing on data/triage.db
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Ingest issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/ingest_issues.py --repo Textualize/textual --db data/triage.db

      - name: Ingest docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/ingest_docs.py --repo Textualize/textual --docs-path docs --db data/triage.db

      - name: Commit updated database
        if: always()   # save whatever progress was made even if an earlier step (e.g. docs ingest) failed
        run: |
          git config user.name "triage-bot"
          git config user.email "actions@github.com"
          git add data/triage.db
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: nightly issue/doc ingest"

          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- fetching and rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Rebase hit a real conflict (likely two workflows writing data/triage.db at once)."
              echo "::error::Not auto-resolving a binary-file conflict -- resolve manually: git pull --rebase, fix, push."
              exit 1
            fi
          done
          echo "::error::Failed to push after 3 attempts."
          exit 1