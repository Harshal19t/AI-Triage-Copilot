name: Triage watch (shadow mode)

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes -- Textual gets roughly 1-2 new issues/day,
                              # so this leaves wide headroom before --lookback (20) could miss one
  workflow_dispatch: {}       # trigger manually from the Actions tab to test without waiting

permissions:
  contents: write   # needed to commit the updated triaged_log table

concurrency:
  group: repo-data-write   # shared with nightly-ingest.yml -- queues instead of racing on data/triage.db
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Cache Chroma index (rebuilds only when triage.db actually changes)
        uses: actions/cache@v4
        with:
          path: data/chroma
          key: chroma-index-${{ hashFiles('data/triage.db') }}

      - name: Build index if the cache didn't have it
        run: |
          if [ ! -d "data/chroma" ] || [ -z "$(ls -A data/chroma 2>/dev/null)" ]; then
            echo "No cached index for this triage.db version -- building fresh."
            python src/build_index.py
          else
            echo "Using cached index -- underlying data hasn't changed since last build."
          fi

      - name: Check for new issues and triage them (shadow mode -- logs only, never posts)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/watch_new_issues.py --repo Textualize/textual --db data/triage.db

      - name: Commit updated triage log
        if: always()   # save whatever progress was made even if the previous step hit something unexpected
        run: |
          git config user.name "triage-bot"
          git config user.email "actions@github.com"
          git add data/triage.db
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: triage new issues (shadow mode)"

          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- fetching and rebasing..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              echo "::error::Rebase hit a real conflict (likely two workflows writing data/triage.db at once)."
              echo "::error::Not auto-resolving a binary-file conflict -- resolve manually: git pull --rebase, fix, push."
              exit 1
            fi
          done
          echo "::error::Failed to push after 3 attempts."
          exit 1